<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Géomédiation : la science de l'organisation, simplifiée pour tous. Envie d'agir ? Découvrez comment, en quelques clics.">
<title>Géomédiation, envie d'agir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --forest:#2F4A3C; --forest-dark:#1F3329; --forest-light:#3E6350;
    --gold:#C9A227; --gold-light:#E0C15C;
    --clay:#B5654A; --clay-light:#CB8268;
    --cream:#F6F1E7; --cream-dark:#EDE4D0; --paper:#FFFDF8;
    --ink:#241E14; --ink-soft:#4A4433; --muted:#857C62; --line:#DDD3BC;
    --display:'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif;
    --body:'Figtree', 'Segoe UI', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    font-family:var(--body); color:var(--ink); background:var(--forest-dark);
    background-image:
      radial-gradient(circle at 12% 6%, rgba(201,162,39,0.13), transparent 42%),
      radial-gradient(circle at 92% 88%, rgba(181,101,74,0.16), transparent 46%);
    min-height:100vh; padding-inline:16px;
  }
  h1,h2,h3,h4{font-family:var(--display); text-wrap:balance;}
  .shell{max-width:720px; margin:0 auto; padding-block:20px 56px;}
  .top{display:flex; align-items:center; justify-content:space-between; gap:12px; color:var(--cream); padding-bottom:16px; min-height:38px;}
  .brand{display:flex; flex-direction:column; align-items:flex-start; gap:2px; background:none; border:none; color:var(--cream); cursor:pointer; padding:0; text-align:left;}
  .brand-name{font-family:var(--display); font-weight:800; font-size:14px; letter-spacing:0.16em;}
  .brand-tag{font-family:var(--body); font-weight:600; font-size:11.5px; color:var(--gold-light);}
  .brand span{color:var(--gold-light);}
  .top-right{display:flex; align-items:center; gap:10px;}
  .pct{font-size:12px; color:rgba(246,241,231,0.72); font-variant-numeric:tabular-nums;}
  .home-btn{white-space:nowrap; flex-shrink:0; font:700 12.5px var(--body); color:var(--forest-dark); background:var(--gold); border:none; border-radius:999px; padding:7px 13px; cursor:pointer;}

  .card{background:var(--cream); border-radius:22px; padding:30px 30px 24px; box-shadow:0 24px 60px rgba(0,0,0,0.3); animation:rise .45s cubic-bezier(.2,.8,.2,1);}
  @keyframes rise{from{opacity:.4; transform:translateY(12px);} to{opacity:1; transform:none;}}
  .kicker{font-size:11.5px; font-weight:700; letter-spacing:0.13em; color:var(--clay); text-transform:uppercase; margin:0 0 6px;}
  .card h2{font-size:clamp(22px,4.6vw,28px); font-weight:800; color:var(--forest-dark); margin:0 0 10px; line-height:1.15; letter-spacing:-0.01em;}
  .lead{font-size:15px; line-height:1.55; color:var(--ink-soft); margin:0 0 18px; max-width:62ch;}
  .small{font-size:12.5px; color:var(--muted); line-height:1.5;}
  .stack{display:flex; flex-direction:column; gap:10px;}
  .label{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.07em; color:var(--muted); margin:20px 0 8px;}

  /* HERO */
  .hero{text-align:center; display:flex; flex-direction:column; align-items:center;}
  .hero h1{font-size:clamp(30px,7vw,46px); font-weight:800; line-height:1.03; letter-spacing:-0.025em; color:var(--forest-dark); margin:4px 0 14px;}
  .hero h1 em{font-style:normal; color:var(--clay);}
  .hero .lead{text-align:center; margin-inline:auto;}
  .venn{width:100%; max-width:290px; margin:2px auto 8px;}
  .venn .ring{transform-origin:center; transform-box:fill-box; animation:breathe 6s ease-in-out infinite;}
  .venn .ring.r2{animation-delay:-2s;} .venn .ring.r3{animation-delay:-4s;}
  @keyframes breathe{50%{transform:scale(1.04);}}
  .badges{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:4px 0 22px;}
  .badge{font-size:12.5px; font-weight:600; color:var(--forest-dark); background:var(--paper); border:1.5px solid var(--line); border-radius:999px; padding:6px 13px;}

  /* Buttons */
  .btn{font-family:var(--body); font-weight:700; font-size:14.5px; padding:12px 24px; border-radius:999px; border:none; cursor:pointer; transition:transform .12s, background .15s;}
  .btn:active{transform:scale(0.97);}
  button:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
  .btn-primary{background:var(--forest); color:#fff;}
  .btn-primary:hover{background:var(--forest-light);}
  .btn-gold{background:var(--gold); color:var(--forest-dark);}
  .btn-gold:hover{background:var(--gold-light);}
  .btn-big{padding:15px 36px; font-size:16px; box-shadow:0 8px 22px rgba(47,74,60,0.28);}
  .btn-ghost{background:transparent; color:var(--muted); padding:12px 6px;}
  .btn-ghost:hover{color:var(--forest-dark);}
  .btn-soft{background:var(--paper); color:var(--forest-dark); border:1.5px solid var(--line);}
  .btn-soft:hover{border-color:var(--gold);}
  .nav{display:flex; justify-content:space-between; align-items:center; margin-top:24px; gap:10px; flex-wrap:wrap;}

  /* Pick cards */
  .pick{display:flex; gap:14px; align-items:flex-start; text-align:left; width:100%; font:inherit; color:inherit; border:2px solid var(--line); background:var(--paper); border-radius:16px; padding:16px 18px; cursor:pointer; transition:border-color .15s, transform .15s, background .15s;}
  .pick:hover{border-color:var(--gold); transform:translateY(-2px);}
  .pick.selected{border-color:var(--forest); background:var(--cream-dark);}
  .pick .ico{font-size:28px; line-height:1; flex-shrink:0;}
  .pt{font-family:var(--display); font-weight:700; font-size:17px; color:var(--forest-dark); display:block; margin-bottom:3px;}
  .pd{font-size:13.5px; color:var(--ink-soft); line-height:1.45;}
  .time{display:inline-block; font-size:11px; font-weight:700; color:var(--clay); background:var(--cream); border-radius:999px; padding:2px 9px; margin-top:7px;}
  .tick{margin-left:auto; width:22px; height:22px; border-radius:7px; border:2px solid var(--line); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff;}
  .pick.selected .tick,.tick.ok{background:var(--forest); border-color:var(--forest);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  /* Hub */
  .tiles{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .tile{position:relative; display:flex; flex-direction:column; gap:6px; text-align:left; font:inherit; color:var(--cream); border:none; border-radius:18px; padding:18px; cursor:pointer; background:var(--forest); transition:transform .15s, box-shadow .15s; min-height:170px;}
  .tile:hover{transform:translateY(-3px); box-shadow:0 12px 26px rgba(31,51,41,0.3);}
  .tile.t2{background:var(--forest-light);} .tile.t3{background:var(--clay);} .tile.t4{background:var(--forest-dark);}
  .tile .ti{font-size:30px; line-height:1;}
  .tile .tt{font-family:var(--display); font-weight:800; font-size:19px; line-height:1.1;}
  .tile .td{font-size:13px; line-height:1.4; opacity:0.9; flex:1;}
  .bar{height:6px; border-radius:3px; background:rgba(246,241,231,0.22); overflow:hidden;}
  .bar i{display:block; height:100%; background:var(--gold-light); border-radius:3px; transition:width .4s;}
  .status{font-size:11.5px; font-weight:700; opacity:0.9;}
  .reco{position:absolute; top:12px; right:12px; font-size:10.5px; font-weight:800; letter-spacing:0.05em; text-transform:uppercase; background:var(--gold); color:var(--forest-dark); border-radius:999px; padding:3px 9px;}
  .carte-btn{display:flex; align-items:center; gap:14px; width:100%; margin-top:12px; text-align:left; font:inherit; border:2px dashed var(--gold); background:var(--paper); border-radius:16px; padding:14px 16px; cursor:pointer; color:var(--forest-dark);}
  .carte-btn:hover{background:#fff;}

  /* Principle / colored cards */
  .principle{border-radius:16px; padding:18px 20px; color:var(--cream); background:var(--forest);}
  .principle.c2{background:var(--forest-light);} .principle.c3{background:var(--clay);} .principle.c4{background:var(--forest-dark);}
  .principle h3{margin:0 0 6px; font-size:18px; font-weight:700; line-height:1.2;}
  .principle p{margin:0; font-size:14.5px; line-height:1.5; opacity:0.95;}
  .more{background:none; border:none; color:var(--gold-light); font:600 12.5px var(--body); padding:8px 0 0; cursor:pointer;}
  .more-text{font-size:13.5px; line-height:1.55; opacity:0.92; margin-top:8px; padding-top:8px; border-top:1px solid rgba(246,241,231,0.22);}
  .react{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .react button{flex:1 1 auto; font:600 12.5px var(--body); padding:8px 10px; border-radius:10px; border:1.5px solid rgba(246,241,231,0.3); background:rgba(246,241,231,0.08); color:var(--cream); cursor:pointer;}
  .react button:hover{background:rgba(246,241,231,0.18);}
  .react button.active{background:var(--gold); border-color:var(--gold); color:var(--forest-dark);}
  .principle input{width:100%; margin-top:10px; padding:9px 12px; border-radius:9px; border:none; font:13px var(--body);}

  /* Accordion questions */
  .q-head{display:flex; align-items:center; gap:12px; width:100%; text-align:left; font:inherit; border:2px solid var(--line); background:var(--paper); border-radius:16px; padding:14px 16px; cursor:pointer;}
  .q-head:hover{border-color:var(--gold);}
  .q-head.open{border-color:var(--forest); border-bottom-left-radius:6px; border-bottom-right-radius:6px;}
  .q-num{font:800 13px var(--display); color:var(--gold-light); background:var(--forest); border-radius:10px; width:34px; height:34px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .q-body{border:2px solid var(--forest); border-top:none; border-radius:0 0 16px 16px; margin-top:-12px; padding:18px 16px 16px; background:#fff; display:flex; flex-direction:column; gap:12px;}

  /* Chips */
  .chip-row{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{font:600 13px var(--body); border:1.5px solid var(--line); background:var(--paper); color:var(--forest-dark); border-radius:999px; padding:8px 14px; cursor:pointer; transition:all .15s;}
  .chip:hover{border-color:var(--gold);}
  .chip.active{background:var(--forest); border-color:var(--forest); color:#fff;}
  .chip.clay.active{background:var(--clay); border-color:var(--clay);}
  .chip.sm{font-size:11.5px; padding:5px 11px;}

  /* Actor & theme cards */
  .mini{display:flex; gap:10px; align-items:flex-start; text-align:left; font:inherit; border:2px solid var(--line); background:var(--paper); border-radius:14px; padding:12px 13px; cursor:pointer; color:var(--ink);}
  .mini:hover{border-color:var(--gold);}
  .mini.selected{border-color:var(--forest); background:var(--cream-dark);}
  .mini .e{font-size:22px; line-height:1;}
  .mini b{display:block; font-size:14px; color:var(--forest-dark);}
  .mini span.s{font-size:12.5px; color:var(--ink-soft); line-height:1.4;}

  /* Ladder of scales */
  .ladder{display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  .ladder .arrow{color:var(--muted); font-size:12px;}
  .rung{font:700 12.5px var(--body); border:none; border-radius:999px; padding:8px 12px; cursor:pointer; color:var(--forest-dark); background:var(--cream-dark); transition:transform .15s;}
  .rung:hover{transform:translateY(-2px);}
  .rung.active{color:#fff;}

  /* Cycle */
  .cycle{width:100%; max-width:320px; display:block; margin:0 auto;}
  .steps8{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .step8{display:flex; gap:9px; align-items:flex-start; font-size:13px; line-height:1.4; color:var(--ink-soft); background:var(--paper); border:1.5px solid var(--line); border-radius:12px; padding:9px 11px;}
  .step8 i{font-style:normal; font:800 12px var(--display); width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .step8 b{color:var(--forest-dark); display:block;}

  /* Tabs */
  .tabs{display:flex; gap:6px; background:var(--cream-dark); padding:5px; border-radius:14px; margin-bottom:16px;}
  .tabs button{flex:1; font:700 13px var(--body); border:none; background:transparent; color:var(--forest-dark); border-radius:10px; padding:10px 6px; cursor:pointer;}
  .tabs button.active{background:var(--forest); color:#fff;}

  /* Domains */
  .domain{background:var(--paper); border:1.5px solid var(--line); border-radius:14px; padding:14px 16px;}
  .domain-top{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:6px;}
  .domain-name{font-weight:700; font-size:15px; color:var(--forest-dark);}
  .mood{font:700 12px var(--body); color:var(--forest-dark); background:var(--cream); border-radius:999px; padding:3px 10px; white-space:nowrap; font-variant-numeric:tabular-nums;}
  input[type=range]{width:100%; accent-color:var(--forest); cursor:pointer;}
  .scale{display:flex; justify-content:space-between; font-size:11px; color:var(--muted);}
  .tip{font-size:12.5px; color:var(--clay); margin-top:6px; line-height:1.45;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:12.5px; font-weight:600; color:var(--forest-dark);}
  .field input,.field textarea{width:100%; font:14px var(--body); padding:10px 12px; border:1.5px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); outline:none;}
  .field input:focus,.field textarea:focus{border-color:var(--forest);}
  .row-inline{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .panel{background:var(--paper); border:1.5px solid var(--line); border-radius:14px; padding:14px 16px;}
  .panel h4{margin:0 0 10px; font-size:15px; color:var(--forest-dark);}
  .mini-dim{display:grid; grid-template-columns:120px 1fr 22px; align-items:center; gap:8px; font-size:12.5px; margin-bottom:6px;}
  .mini-dim b{color:var(--clay); text-align:right; font-variant-numeric:tabular-nums;}
  .seg3{display:flex; gap:6px; margin-top:8px;}
  .seg3 button{flex:1; font:600 12px var(--body); border:1.5px solid var(--line); background:var(--cream); border-radius:9px; padding:7px 4px; cursor:pointer; color:var(--forest-dark);}
  .seg3 button.active{background:var(--clay); border-color:var(--clay); color:#fff;}

  /* Missions */
  .mission{display:grid; grid-template-columns:44px 1fr; gap:12px; background:var(--paper); border:2px solid var(--line); border-radius:16px; padding:16px; transition:border-color .15s;}
  .mission.on{border-color:var(--forest);}
  .mission .num{width:44px; height:44px; border-radius:14px; background:var(--forest); color:var(--gold-light); font:800 20px var(--display); display:flex; align-items:center; justify-content:center;}
  .mission.m2 .num{background:var(--forest-light);} .mission.m3 .num{background:var(--clay); color:var(--cream);} .mission.m4 .num{background:var(--gold); color:var(--forest-dark);}
  .mission h3{margin:2px 0 4px; font-size:17px; color:var(--forest-dark);}
  .mission p{margin:0; font-size:14px; line-height:1.5; color:var(--ink-soft);}
  .yes{margin-top:10px; font:700 12.5px var(--body); border:1.5px solid var(--line); background:var(--cream); color:var(--forest-dark); border-radius:999px; padding:6px 13px; cursor:pointer;}
  .mission.on .yes{background:var(--forest); border-color:var(--forest); color:#fff;}
  .tagbox{display:flex; gap:6px; margin-top:10px;}
  .tagbox input{flex:1; min-width:0; font:14px var(--body); padding:9px 12px; border:1.5px solid var(--line); border-radius:10px;}
  .actor{display:inline-flex; align-items:center; gap:6px; font:600 12.5px var(--body); background:var(--cream-dark); color:var(--forest-dark); border-radius:999px; padding:5px 6px 5px 12px;}
  .actor button{border:none; background:var(--paper); border-radius:50%; width:20px; height:20px; cursor:pointer; font-size:12px; line-height:1; color:var(--muted);}
  .sync{width:100%; max-width:420px; display:block; margin:12px 0 2px;}

  .qrow{display:flex; align-items:center; justify-content:space-between; gap:14px; background:var(--forest); color:var(--cream); border-radius:14px; padding:14px 16px; font-size:14px; font-weight:600; line-height:1.4;}
  .qrow.clay{background:var(--clay);}
  .toggle{width:50px; height:28px; border-radius:15px; background:rgba(246,241,231,0.28); position:relative; cursor:pointer; flex-shrink:0; border:none; transition:background .2s;}
  .toggle.on{background:var(--gold);}
  .toggle .knob{position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:var(--cream); transition:left .2s;}
  .toggle.on .knob{left:25px;}

  .collab{background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:14px 15px;}
  .collab .pole{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--gold);}
  .collab .nm{font-family:var(--display); font-weight:700; font-size:15.5px; color:var(--forest-dark); margin:2px 0;}
  .collab .rl{font-size:13px; color:var(--ink-soft); line-height:1.4; margin-bottom:8px;}
  .tag{font-size:11px; font-weight:600; color:var(--clay); background:var(--cream-dark); padding:3px 9px; border-radius:999px;}

  .ring-wrap{display:flex; align-items:center; gap:18px; background:var(--forest); border-radius:18px; padding:18px 20px; color:var(--cream); margin-bottom:14px;}
  .ring{width:78px; height:78px; border-radius:50%; background:conic-gradient(var(--gold) calc(var(--pct)*1%), rgba(255,255,255,0.15) 0); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .ring span{width:62px; height:62px; border-radius:50%; background:var(--forest); display:flex; align-items:center; justify-content:center; font:800 17px var(--display); font-variant-numeric:tabular-nums;}
  .rblock{background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:12px 15px;}
  .rblock h4{margin:0 0 4px; font:700 11.5px var(--body); text-transform:uppercase; letter-spacing:0.07em; color:var(--clay);}
  .rblock p{margin:0; font-size:14px; line-height:1.5; color:var(--ink-soft);}
  .slogan{font-family:var(--display); font-weight:700; font-size:19px; line-height:1.3; color:var(--forest-dark); border-left:4px solid var(--gold); padding:4px 0 4px 14px; margin:18px 0;}
  .msg{background:var(--forest); color:var(--cream); border-radius:12px; padding:12px 15px; font-size:13.5px; line-height:1.5; margin-top:10px;}
  .msg textarea{width:100%; margin-top:8px; min-height:120px; font:12.5px var(--body); border-radius:8px; border:none; padding:8px;}
  details.more-box{background:var(--paper); border:1.5px solid var(--line); border-radius:12px; padding:10px 14px;}
  details.more-box summary{cursor:pointer; font-weight:700; color:var(--clay); font-size:13.5px;}
  details.more-box p{font-size:13.5px; line-height:1.55; color:var(--ink-soft); margin:10px 0 0;}
  .place{background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:9px 12px; font-size:13px; line-height:1.45; color:var(--ink-soft); margin-top:8px;}
  .place b{color:var(--forest-dark);}
  .steps6{counter-reset:s; display:flex; flex-direction:column; gap:7px; margin:10px 0 0; padding:0; list-style:none;}
  .steps6 li{counter-increment:s; display:flex; gap:10px; align-items:flex-start; font-size:13.5px; line-height:1.4; color:var(--ink-soft);}
  .steps6 li::before{content:counter(s); flex-shrink:0; width:22px; height:22px; border-radius:50%; background:var(--forest); color:#fff; font:700 11px var(--body); display:flex; align-items:center; justify-content:center;}
  .empty{background:var(--paper); border:1.5px dashed var(--line); border-radius:12px; padding:12px 14px; font-size:13.5px; color:var(--ink-soft); line-height:1.5;}
  .linkbtn{background:none; border:none; padding:0; font:700 13.5px var(--body); color:var(--clay); cursor:pointer; text-decoration:underline;}

  .questions{list-style:none; padding:0; margin:0 0 6px; display:flex; flex-direction:column; gap:8px; max-width:520px;}
  .questions li{font-size:15.5px; line-height:1.4; color:var(--forest-dark); background:var(--paper); border:1.5px solid var(--line); border-radius:14px; padding:10px 14px; animation:pop .5s cubic-bezier(.2,.8,.2,1) both;}
  .questions li:nth-child(2){animation-delay:.15s;} .questions li:nth-child(3){animation-delay:.3s; border-color:var(--gold);}
  @keyframes pop{from{opacity:.3; transform:translateY(8px) scale(.98);} to{opacity:1; transform:none;}}
  .tangle-wrap{position:relative; width:100%; max-width:360px; margin:10px auto 4px;}
  .tangle{width:100%; display:block; overflow:visible;}
  .tangle .nd{transition:transform 1.1s cubic-bezier(.3,.9,.3,1);}
  .tangle .lines-tangled{transition:opacity .6s;}
  .tangle .lines-tidy,.tangle .center{opacity:0; transition:opacity .8s .5s;}
  .untangled .tangle .lines-tangled{opacity:0;}
  .untangled .tangle .lines-tidy,.untangled .tangle .center{opacity:1;}
  .untangle-btn{margin-top:4px;}

function wireSlide(){

  const guy=svg.querySelector('.slider'), cap=svg.querySelector('.slide-cap'), pts=[...svg.querySelectorAll('.sp')];

  const N=CYCLE.length-1, CLIMB=1800, PAUSE=700, SLIDE=6600, END=1400, TOTAL=CLIMB+PAUSE+SLIDE+END;

    {parts:[{h:"L'aménagement du territoire, c'est quoi\u00a0?", p:"C'est la partie <b>opérationnelle</b> de la géographie. Il étudie comment améliorer la manière dont on prend les décisions, pour répartir équitablement les <b>populations</b>, les <b>activités</b> et les <b>services</b>, et répondre de manière <b>durable</b> aux besoins de chacun."}, {p:"Toutes les échelles se complètent : aucune ne prime sur les autres. La <b>région</b> peut servir de tremplin, et le <b>Sud-Ouest</b> a de sérieux atouts. Et pour simplifier le quotidien : <b>mutualiser les services</b> des 5 grands domaines dans un même quartier."}],
     details:[
      {sum:"+ Pourquoi une région, et pourquoi le Sud-Ouest", html:`<p><b>Les solutions existent déjà partout.</b> L'enjeu : les déployer à la bonne échelle, avec des <b>feuilles de route</b> et des <b>marchés intentionnels</b> validés par les acteurs, puis par les citoyens.</p>
        <p><b>Les expériences locales l'ont prouvé.</b> Collectivités de Catalogne en 1936, Chiapas au Mexique, Rojava en Syrie… Chacune a montré qu'on peut vivre autrement. Mais trop locales, elles ont eu du mal à s'étendre.</p>
        <p><b>La région, le bon tremplin.</b> Assez grande pour produire intelligemment ce dont on a besoin, assez proche pour rester à taille humaine. Une région pilote inspire tout un pays, qui inspire à son tour le monde. Plus elle coopère, plus elle redistribue vers départements et communes (<b>subsidiarité</b>). C'est l'esprit du <b>biorégionalisme</b>.</p>
        <p><b>Le Sud-Ouest, un terreau naturel.</b> Le Pays Basque a traversé les siècles et les invasions, avec une langue dont on ignore encore l'origine. Son secret ? Il n'a jamais été réuni sous un seul roi. À la place, une longue tradition d'<b>autogestion</b> : des villages reliés entre eux, des assemblées locales, des règles partagées. Capable de montrer les muscles, mais surtout de <b>coopérer</b> quand il le fallait. Cet esprit a infusé tout le Sud-Ouest, des Girondins aux Cathares : un goût pour l'<b>autonomie</b> et l'<b>universalisme</b>, qui se complètent. Preuve vivante : <b>Mondragón</b>, née en 1956 au Pays Basque, est aujourd'hui l'un des plus grands groupes coopératifs au monde.</p>
        <p><b>Une piste : Nouvelle-Aquitaine et Occitanie.</b> Une identité commune, un même bassin, celui de la Garonne. De quoi montrer comment mutualiser services publics et privés, jusqu'à réaffecter les bâtiments disponibles là où c'est utile.</p>
        <p class="slogan-pill">Autonome et universaliste : l'esprit du Sud-Ouest.</p>`},
      {sum:"+ Bordeaux-Mériadeck 2030 : 5 domaines, un même quartier", html:()=>`<p>Une proposition : réunir les 5 grands domaines dans <b>un même quartier</b> pour <b>mutualiser les services</b> publics et privés. Tout est à deux pas, et la coopération devient naturelle. Les lieux déjà présents peuvent accueillir chaque domaine :</p>
        ${THEMES.map(t=>`<div class="place">${t.e} <b>${t.lieu}</b> · ${t.ld}</div>`).join('')}
        <p><b>Cap sur l'équilibre.</b> Que chacun ait une activité alignée avec ses aspirations, un logement proche, une mobilité fluide et des services bien répartis, grâce à des investissements équitables et durables. On estime aussi le nombre d'heures nécessaires pour produire ce dont la population a besoin, réparti entre les citoyens en capacité de produire, selon leurs aspirations.</p>
        <p><b>Un exemple concret.</b> Emploi, logement, finance, éducation : aujourd'hui l'information est dispersée. Une annonce immobilière pourrait passer par une <b>agence publique locale</b>, où les pros sont rémunérés pour le service rendu (comme un médecin payé pour bien soigner, pas pour multiplier les actes). Même logique pour tous les métiers, selon les <b>besoins réels</b> de chaque territoire. Des interfaces locales mettraient le marché local en avant, sans rien interdire : l'import reste possible s'il respecte le marché local, l'environnement et la loi.</p>
        <p><b>Cercles et sous-cercles.</b> Chaque thématique et chaque échelle a son cercle de coopération, et ses sous-cercles (« Psychologie » dans « Santé », par exemple). Données, projets, votes et évaluations circulent de l'un à l'autre.</p>`},
      {sum:"+ Le déploiement en 6 étapes, et 2 gestes pour se lancer", html:`<ol class="steps6"><li>Structurer les acteurs de la transition</li><li>Sonder et échanger, pour installer la confiance</li><li>Co-construire des feuilles de route par filière (court, moyen, long terme), accordées entre elles</li><li>Validation institutionnelle et citoyenne</li><li>Expérimenter et évaluer</li><li>Inspirer les partenaires nationaux et internationaux</li></ol>
        <p><b>Geste 1 : participer</b> à la préparation de ce projet territorial.</p>
        <p><b>Geste 2 : une vidéo d'une minute</b>, par exemple : « J'ai compris que tout est lié. Je m'implique chez moi et au travail, et je soutiens les médiateurs territoriaux pour qu'ils préparent et animent cette concertation. » À partager avec les médiateurs, vos proches et vos collègues !</p>`}],

function A(dk){ return state.a[dk]||(state.a[dk]={}); }
function go(view, dream){ state.hist=(state.hist||[]).concat({v:state.view,d:state.dream}).slice(-30); state.view=view; if(dream!==undefined) state.dream=dream; render(); window.scrollTo({top:0,behavior:'smooth'}); }

      if(P.slogan) box.appendChild(h('p',{class:'slogan-pill'},P.slogan));
      if(P.link){ const [k,t]=P.link; box.appendChild(h('button',{class:'btn btn-gold', style:'align-self:flex-start;padding:10px 18px;font-size:14px', onclick:()=>go('dream',k)},t)); }
      if(P.w) wires.push(()=>P.w(box));
      card.appendChild(box); });
    L.fields.forEach(f=>card.appendChild(field(d.k,f)));
    (L.details||[]).forEach(D=>{ const det=h('details',{class:'more-box'}); det.innerHTML=`<summary>${D.sum}</summary>`+(typeof D.html==='function'?D.html():D.html); card.appendChild(det); });
    root.appendChild(card);
  }
  wires.forEach(f=>f());
  if(lv<d.levels.length){ const nx=d.levels[lv]; add(h('button',{class:'btn btn-soft more-btn', onclick:()=>openLevel(d,lv+1)},`✨ Je veux en savoir plus<span class="more-sub">Niveau ${lv+1} · ${nx.name||LEVEL_NAMES[lv]}</span>`)); }
  else add(h('p',{class:'all-done'},'🌟 Vous avez exploré les 3 niveaux.'));
  add(h('div',{class:'lvl', style:'gap:8px'}, null)); root.lastChild.appendChild(field(d.k, {k:'remarque', type:'area', label:'💬 Une question, une remarque, une piste d\'amélioration\u00a0?', ph:'Écrivez librement : elle rejoint votre récap.'}));
  const on=!!state.acc[d.k];
  add(h('button',{class:'acc'+(on?' on':''), 'aria-pressed':String(on), onclick:()=>{ state.acc[d.k]=!on; render(); }}, `<span class="box">${on?'✓':''}</span><span><b>🤝 Je souhaite être accompagné</b> par un professionnel sur ce sujet</span>`));
  add(h('p',{class:'hint center'},'✓ Vos réponses s\'ajoutent automatiquement à votre récap'));
  const n=h('div',{class:'nav'});
  n.append(h('button',{class:'btn btn-ghost', onclick:()=>go('home')},'← Accueil'), h('button',{class:'btn btn-primary', onclick:()=>go('recap')},'Mon récap →'));
  add(n);
}

/* ================= RÉCAP ================= */
function recapItems(){
  const it=[]; const push=(g,t)=>it.push({id:g+'|'+t,g,t});
  DREAMS.forEach(d=>{ const a=state.a[d.k]||{}; const g=d.e+' '+d.cat+' · '+d.t;
    d.levels.forEach(L=>L.fields.forEach(f=>{ const v=a[f.k]; const lab=(f.label||'').replace(/<[^>]+>/g,'').replace(/ /g,' ');
      if(f.type==='chips' && v&&v.length) push(g, lab+' : '+v.join(', '));
      else if(f.type==='chips1' && v) push(g, lab.replace(/ ?\?$/,'')+' : '+v);
      else if(f.type==='toggle' && v) push(g, f.k==='question' ? 'J\'ai posé LA question' : lab.replace(/^\S+\s(?=Je)/,''));
      else if(f.type==='scales' && v&&v.length) push(g, 'Mes échelles : '+v.map(e=>echLabel(a,e)).join(', '));
      else if(f.type==='stepsEvalMulti' && v){ const sel=(a[f.src]||[]); (sel.length?sel:['Votre territoire']).forEach(e=>{ const x=v[e]; if(x && Object.values(x).some(n=>n>0)) push(g, 'Où en est l\'organisation · '+echLabel(a,e)+' : '+CYCLE.map(c=>c.n+' '+(x[c.k]||0)+'/5').join(', ')); }); }
      else if(f.type==='domainsEval' && v && Object.values(v).some(x=>x>0)) push(g, 'Mon point : '+INDIV_DOMAINS.map(x=>x.n+' '+(v[x.k]||0)+'/5').join(', '));
      else if(f.type==='principles' && v) PRINCIPLES.forEach(p=>{ const o=REACTIONS.find(r=>r.k===v[p.k]); if(o) push(g, '« '+p.t+' » : '+o.n); });
      else if((f.type==='text'||f.type==='area') && v) push(g, (f.k==='ecriture'?'Mon écriture intuitive':lab.replace(/ ?\?$/,''))+' : '+v);
      else if(f.type==='slider' && v) push(g, lab+' : '+v+'/5');
      else if(f.type==='stepsEval' && v && Object.keys(v).length) push(g, 'Où en est l\'organisation : '+CYCLE.map(c=>c.n+' '+(v[c.k]||0)+'/5').join(', '));
      else if(f.type==='cards1' && v) push(g, lab+' : '+v);
      else if(f.type==='cardsN' && v&&v.length) push(g, lab+' : '+v.join(', '));
      else if(f.type==='invite' && v) push(g, "J'ai partagé l'invitation autour de moi");
    }));
    if(a.remarque) push(g, 'Ma question / remarque : '+a.remarque);
    const lv=state.lvl[d.k]||1; if(lv>1) push(g, 'Je veux en savoir plus (niveau '+lv+' exploré)');
    if(state.acc[d.k]) push(g, 'Je souhaite être accompagné par un professionnel');
  });
  return it;
}
function renderRecap(){
  confetti();
  add(h('div',{class:'kicker'},'Mon récap'));
  add(h('h2',null,'🌟 Vos actions prennent forme'));
  const items=recapItems();
  if(!items.length){ add(h('p',{class:'lead'},"Votre récap se remplit au fil de vos réponses. Choisissez où agir pour commencer !")); add(h('button',{class:'btn btn-primary', onclick:()=>go('home')},'Choisir où agir →')); return; }
  add(h('p',{class:'lead'},"Tout ce que vous avez choisi est ici. <b>Cochez</b> ce que vous voulez partager, puis choisissez <b>à qui l'envoyer</b> : vous avancez de manière autonome et connectée, accompagné si vous le souhaitez."));
  const box=h('div',{class:'send-box'}); let g0=null;
  items.forEach(x=>{ if(x.g!==g0){ box.appendChild(h('div',{class:'grp'},esc(x.g))); g0=x.g; }
    const lab=h('label',{class:'send-item'}); const cb=h('input',{type:'checkbox'}); cb.checked=state.sendSel[x.id]!==false; cb.onchange=()=>{ state.sendSel[x.id]=cb.checked; save(); };
    lab.append(cb, h('span',null,esc(x.t))); box.appendChild(lab); });
  box.appendChild(h('div',{class:'grp', style:'margin-top:16px'},'À qui ?'));
  const row=h('div',{class:'chip-row'});
  [{k:'med',n:'Un médiateur Géomédiation'},{k:'autre',n:'Une autre adresse'},{k:'libre',n:'Je choisis dans ma messagerie'}].forEach(r=>row.appendChild(h('button',{class:'chip sm'+(state.sendTo===r.k?' active':''), onclick:()=>{ state.sendTo=r.k; render(); }}, r.n)));
  box.appendChild(row);
  if(state.sendTo==='autre'){ const f=h('div',{class:'fld'}); f.appendChild(h('label',{class:'fld-label',for:'sendAddr'},'Adresse e-mail')); const i=h('input',{id:'sendAddr',type:'text',placeholder:'ex. prenom@exemple.fr'}); i.value=state.sendAddr||''; i.oninput=e=>state.sendAddr=e.target.value; f.appendChild(i); box.appendChild(f); }
  const body=()=>{ const sel=items.filter(x=>state.sendSel[x.id]!==false); let g=null; const L=['Bonjour,','','Voici mon récap Géomédiation :']; sel.forEach(x=>{ if(x.g!==g){ L.push('', x.g); g=x.g; } L.push('- '+x.t); }); L.push('','Merci !'); return L.join('\n'); };
  const btns=h('div',{class:'row-inline', style:'margin-top:14px'});
  const mail=h('a',{class:'mail-btn', href:'#'},'📬 Préparer l\'e-mail');
  mail.onclick=()=>{ const to=state.sendTo==='med'?CONTACT_MAIL:state.sendTo==='autre'?(state.sendAddr||'').trim():''; mail.href='mailto:'+to+'?subject='+encodeURIComponent('Mon récap Géomédiation')+'&body='+encodeURIComponent(body()); };
  const msg=h('div',{class:'msg'}); msg.hidden=true;
  btns.append(mail, h('button',{class:'btn btn-soft', style:'padding:8px 14px;font-size:13px', onclick:()=>copyText(body(),msg)},'📋 Copier la sélection'));
  box.append(btns,msg);
  if(state.sendTo==='med') box.appendChild(h('p',{class:'small', style:'margin:10px 0 0'},`Adresse du médiateur : <b>${CONTACT_MAIL}</b>`));
  add(box);
  const n=h('div',{class:'nav'});
  n.append(h('button',{class:'btn btn-ghost', onclick:goBack},'← Retour'), h('button',{class:'btn btn-soft', onclick:()=>go('home')},'Découvrir une autre carte →'));
  add(n);
  add(h('p',{class:'small center', style:'margin-top:14px'},"🔒 Vos réponses restent sur votre appareil. Une fois transmises, vous pouvez en demander la suppression à tout moment (RGPD)."));
}

/* ================= RENDU ================= */
function render(){
  const slot=$('homeSlot'); slot.innerHTML='';
  if(state.view!=='home') slot.appendChild(h('button',{class:'back-btn', onclick:goBack},'← Retour'));
  root.innerHTML='';
  ({home:renderHome, dream:renderDream, recap:renderRecap}[state.view]||renderHome)();
  add(h('p',{class:'small center', style:'margin-top:18px'}, `💬 ${state.view==='dream'?'':"Une question, une remarque, une piste d'amélioration\u00a0? "}Écrivez-nous à tout moment\u00a0: <a href="mailto:${CONTACT_MAIL}?subject=${encodeURIComponent('Géomédiation : ma question')}" style="color:var(--clay);font-weight:700">${CONTACT_MAIL}</a>`));
  save();
}
$('brandBtn').onclick=()=>go('home');
render();

</script>
